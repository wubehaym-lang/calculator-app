<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="calculator.css">
</head>
<body>
  <div class="claculatorBox">
    <div class="display" id="display"> </div>

    <div class="buttons-grid">
      <div class="btns del">DEL</div>
      <div class="btns ac">AC</div>
      <div class="btns pri percent">%</div>
      <div class="btns oprat">/</div>
      <div class="btns num">1</div>
      <div class="btns num">2</div>
      <div class="btns num">3</div>
      <div class="btns oprat">*</div>
      <div class="btns num">4</div>
      <div class="btns num">5</div>
      <div class="btns num">6</div>
      <div class="btns oprat">-</div>
      <div class="btns num">7</div>
      <div class="btns num">8</div>
      <div class="btns num">9</div>
      <div class="btns oprat">+</div>
      <div class="btns zeros">00</div>
      <div class="btns zeros">0</div>
      <div class="btns numDot">.</div>
      <div class="btns solve">=</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
